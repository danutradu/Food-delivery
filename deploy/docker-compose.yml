      - CORS_ALLOW_CREDENTIALS=false
      - RATE_LIMIT_MAX_REQUESTS=1000
      - RATE_LIMIT_WINDOW=PT1M
    depends_on:
      auth-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      restaurant-ops-service:
