databaseChangeLog:
  - changeSet:
      id: common-001-create-outbox-event
      author: food-delivery
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - not:
            tableExists:
              tableName: outbox_event
      changes:
        - createTable:
            tableName: outbox_event
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: topic
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: event_type
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: key
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: payload_json
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: retry_count
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: last_retry_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: claimed_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: last_error
                  type: TEXT
              - column:
                  name: published_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: status
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
        - createIndex:
            tableName: outbox_event
            indexName: idx_outbox_event_status_created_at
            columns:
              - column:
                  name: status
              - column:
                  name: created_at
        - createIndex:
            tableName: outbox_event
            indexName: idx_outbox_event_status_claimed_created
            columns:
              - column:
                  name: status
              - column:
                  name: claimed_at
              - column:
                  name: created_at
