databaseChangeLog:
  - changeSet:
      id: common-001-create-outbox-event
      author: food-delivery
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - not:
            tableExists:
              tableName: outbox_event
      changes:
        - createTable:
            tableName: outbox_event
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: topic
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: event_type
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: key
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: payload_json
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: retry_count
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: last_retry_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: claimed_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: last_error
                  type: TEXT
              - column:
                  name: published_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: status
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
        - createIndex:
            tableName: outbox_event
            indexName: idx_outbox_event_status_created_at
            columns:
              - column:
                  name: status
              - column:
                  name: created_at
        - createIndex:
            tableName: outbox_event
            indexName: idx_outbox_event_status_claimed_created
            columns:
              - column:
                  name: status
              - column:
                  name: claimed_at
              - column:
                  name: created_at

  - changeSet:
      id: common-002-create-dlt-events
      author: food-delivery
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - not:
            tableExists:
              tableName: dlt_events
      changes:
        - createTable:
            tableName: dlt_events
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: service_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: source_topic
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: dlt_topic
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: original_key
                  type: VARCHAR(255)
              - column:
                  name: original_partition
                  type: INTEGER
              - column:
                  name: original_offset
                  type: BIGINT
              - column:
                  name: event_type
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: payload_bytes
                  type: BYTEA
                  constraints:
                    nullable: false
              - column:
                  name: payload_encoding
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: schema_full_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: parked_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

  - changeSet:
      id: common-003-create-dlt-event-indexes
      author: food-delivery
      changes:
        - createIndex:
            tableName: dlt_events
            indexName: idx_dlt_events_status
            columns:
              - column:
                  name: status
        - createIndex:
            tableName: dlt_events
            indexName: idx_dlt_events_service_name
            columns:
              - column:
                  name: service_name
        - createIndex:
            tableName: dlt_events
            indexName: idx_dlt_events_source_topic
            columns:
              - column:
                  name: source_topic
